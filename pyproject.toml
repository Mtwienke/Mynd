[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mynd"
version = "0.1.0"
description = "Local-first PDF ingestion and citation linking for Obsidian"
requires-python = ">=3.11"
dependencies = [
  "pymupdf>=1.24.3",
  "httpx>=0.28",
  "typer>=0.27",
  "defusedxml>=0.7.1",
  "prompt-toolkit>=3.0.52,<4",
  "markdown-it-py>=3,<5",
  "PyYAML>=6,<7",
  "python-dotenv>=1.2,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
mynd = "mynd.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
include = ["mynd*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
"src/mynd/cli.py" = ["B008"]  # Typer requires Option()/Argument() calls in defaults

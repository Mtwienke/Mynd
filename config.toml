# Replace vault_path with the absolute path to your Obsidian vault.
vault_path = "./Obsidian/MyndVault"
data_path = "./vault"
inbox_path = "./vault/00 Inbox"
pdf_store_path = "./vault/10 Papers"
database_path = "./vault/mynd.sqlite3"

# Optional GROBID service, useful for extracting bibliographies.
# Start locally with Docker, then leave this URL as-is.
grobid_url = "http://localhost:8070"
use_grobid = true

# Contact email is polite for Crossref API use. Replace with your email.
crossref_email = "you@example.com"

# PDFs are only sent to a loopback GROBID host by default. Set this to true
# only if you intentionally run GROBID on another machine.
allow_remote_services = false

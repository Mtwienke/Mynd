# vault_path is the Obsidian vault; data_path is Mynd's runtime data directory
# (mode file, extracted text, SQLite). They are deliberately separate.
vault_path = "./Obsidian/MyndVault"
data_path = "./vault"
inbox_path = "./vault/00 Inbox"
slides_inbox_path = "./vault/00 Inbox/Slides"
pdf_store_path = "./vault/10 Papers"
database_path = "./vault/mynd.sqlite3"

# Optional GROBID service, useful for extracting bibliographies.
# Start locally with Docker, then leave this URL as-is.
grobid_url = "http://localhost:8070"
use_grobid = true

# Contact email is polite for Crossref API use. Replace with your email.
crossref_email = "you@example.com"

# PDFs are only sent to a loopback GROBID host by default. Set this to true
# only if you intentionally run GROBID on another machine.
allow_remote_services = false

# Independently callable vault maintenance: mynd clean / mynd connect.
topics_folder = "20 Topics"
maintenance_excludes = [] # Vault-relative glob patterns; dotfolders/symlinks are always excluded.
# Search/fetch are hosted, while ALL text generation stays local. Only approved
# topic queries and URLs leave your machine. A free Ollama API key is required:
# export OLLAMA_API_KEY="..." (never put the key in this file).
topic_web_enabled = false # Opt in here, or use `mynd connect --web`.
topic_web_cache_days = 30
